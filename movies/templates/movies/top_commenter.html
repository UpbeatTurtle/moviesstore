{% extends 'base.html' %}
{% block content %}
<div class="p-3">
  <div class="container">
    <div class="row mt-3">
      <div class="col mx-auto mb-3">
        <h2>Top Commenter</h2>
        {% if template_data.top_reviewer %}
        <p><strong>Top Commenter: </strong> {{template_data.top_reviewer}}
          <br>
            <strong>Comment Count:</strong> {{template_data.top_count}}
        </p>
        {% else %}
            <p> No comments yet</p>
        {% endif %}
      </div>
    </div>
  </div>
</div>
{% endblock content %}
